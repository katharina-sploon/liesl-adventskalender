<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Liesl-Adventskalender 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Konzeptpapier im Liesl-CI. Gelber Kopf, dann zwei klar getrennte Ideen-Kapitel; Kalender-Raster als Herzstück. */
:root{
  --bg:#FFFFFF;
  --surface:#FAF8F2;
  --ink:#141310;
  --muted:#5E5A4F;
  --line:#E7E2D3;
  --yellow:#FFD447;
  --yellow-soft:#FFECAD;
  --on-yellow:#141310;
  --dog:#FFECAD;
  --sitter:#E3EEF7;
  --sitter-ink:#1F4A6B;
  --partner:#141310;
  --partner-ink:#FFD447;
  --wish-bg:#141310;
  --wish-fg:#F4F1E8;
  --font:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12110E;--surface:#1C1A15;--ink:#F4F1E8;--muted:#B3AD9C;--line:#332F25;
  --yellow:#FFD447;--yellow-soft:#3A3220;--on-yellow:#141310;--dog:#3A3220;--sitter:#1D2B37;--sitter-ink:#A9CBE6;
  --partner:#FFD447;--partner-ink:#141310;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12110E;--surface:#1C1A15;--ink:#F4F1E8;--muted:#B3AD9C;--line:#332F25;
  --yellow:#FFD447;--yellow-soft:#3A3220;--on-yellow:#141310;--dog:#3A3220;--sitter:#1D2B37;--sitter-ink:#A9CBE6;
  --partner:#FFD447;--partner-ink:#141310;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding-inline:20px}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:17px;max-width:62ch}

/* Hero */
.hero{background:var(--yellow);color:var(--on-yellow);padding-block:56px 48px}
.hero .wrap{display:grid;gap:18px}
.hero .eyebrow{color:var(--on-yellow);opacity:.7}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.02em}
.hero .lead{color:var(--on-yellow)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;font-weight:500}

/* Two ideas overview */
.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:-28px}
.idea{background:var(--bg);border:1.5px solid var(--ink);border-radius:18px;padding:22px;display:grid;gap:8px;align-content:start}
.idea .tag{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--yellow);color:var(--on-yellow)}
.idea .tag.alt{background:var(--ink);color:var(--bg)}
.idea h3{font-size:20px;font-weight:700}
.idea p{color:var(--muted);font-size:14px}
.idea a{color:var(--ink);font-weight:600;font-size:14px}

/* Chapters */
.chapter{padding-block:64px 8px}
.chapter-head{display:grid;gap:10px;margin-bottom:28px}
.chapter-head .num{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:10px}
.chapter-head .num span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--yellow);color:var(--on-yellow)}
.chapter-head h2{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.01em}
.divider{border:0;border-top:1.5px dashed var(--line);margin:56px 0 0}

section.block{display:grid;gap:16px;margin-top:44px}
section.block h3{font-size:21px;font-weight:700}
section.block > p{max-width:65ch;color:var(--ink)}
.note{color:var(--muted);font-size:14px;max-width:65ch}

/* Calendar */
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(64px,1fr));gap:6px;min-width:500px}
.dow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.day{aspect-ratio:1/1;max-width:100%;border-radius:12px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-variant-numeric:tabular-nums}
.day b{font-size:20px;font-weight:700;line-height:1}
.day small{font-size:10.5px;font-weight:600;line-height:1.2}
.day.off{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.day.off b{font-size:13px;font-weight:500}
.day.dog{background:var(--dog);color:var(--ink)}
.day.sitter{background:var(--sitter);color:var(--sitter-ink)}
.day.partner{background:var(--partner);color:var(--partner-ink)}
.day.club{background:var(--yellow);color:var(--on-yellow);outline:2.5px solid var(--ink);outline-offset:-2.5px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.legend .l-dog{background:var(--dog);border:1px solid var(--line)}
.legend .l-sitter{background:var(--sitter)}
.legend .l-partner{background:var(--partner)}
.legend .l-club{background:var(--yellow);outline:2px solid var(--ink);outline-offset:-2px}

/* Stat row */
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mix div{background:var(--surface);border-radius:14px;padding:16px;display:grid;gap:2px}
.mix strong{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.mix span{font-size:13px;color:var(--muted)}

/* Cards / lists */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border-radius:16px;padding:20px;display:grid;gap:10px;align-content:start;min-width:0}
.card h4{margin:0;font-size:16px;font-weight:700}
.card p,.card li{font-size:14px}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
ul.clean li::marker{color:var(--muted)}

/* Slide mockups */
.slides{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slide{aspect-ratio:4/5;max-width:100%;border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg);border:1px solid var(--line);font-size:11.5px;line-height:1.35;min-width:0}
.slide.cover{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.slide .n{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.slide strong{font-size:12.5px;font-weight:700}
.photo{flex:1;margin:6px 0;border-radius:6px;background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);min-height:20px}
.slides .slide.story{aspect-ratio:9/16}
.slide.cover .photo{background:repeating-linear-gradient(135deg,rgba(20,19,16,.15) 0 6px,transparent 6px 12px)}

/* Table */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface)}
tr:last-child td{border-bottom:0}
td.date{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}

/* Form */
.form{display:grid;gap:12px}
.fpart{border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px}
.fpart h4{margin:0;font-size:15px;font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fpart h4 em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:4px 16px;font-size:14px;padding-top:8px;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0;padding-top:0}
.field b{font-weight:600}
.field span{color:var(--muted)}
@media (max-width:560px){.field{grid-template-columns:1fr}}

/* Copy blocks */
.copy{background:var(--surface);border-radius:14px;padding:18px 20px;display:grid;gap:10px;min-width:0}
.copy .lbl{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.copy p{white-space:pre-line;font-size:14px}
.channel{display:grid;gap:12px}
.channel-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.channel-head h4{margin:0;font-size:17px;font-weight:700}
.channel-head span{font-size:13px;color:var(--muted)}

/* Wish chapter */
.wish{background:var(--wish-bg);color:var(--wish-fg);border:1px solid var(--line);border-radius:24px;padding-block:44px;padding-inline:clamp(20px,4vw,44px);display:grid;gap:28px;margin-top:8px}
.wish .eyebrow{color:var(--yellow)}
.wish h2{font-size:clamp(26px,4vw,38px);font-weight:800;color:var(--wish-fg)}
.wish .lead{color:var(--wish-fg);opacity:.85}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;counter-reset:s}
.step{border:1px solid rgba(255,212,71,.35);border-radius:14px;padding:16px;display:grid;gap:6px;align-content:start}
.step b{color:var(--yellow);font-size:13px;font-weight:700}
.step p{font-size:14px;opacity:.9}
.sitter-wish{border:1px solid rgba(255,212,71,.35);border-radius:16px;padding:20px;display:grid;gap:10px}
.sitter-wish h3{font-size:20px;font-weight:700;color:var(--wish-fg)}
.sitter-wish p{font-size:14px;max-width:65ch}
.wish .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.wish .facts div{background:rgba(255,212,71,.1);border-radius:14px;padding:16px;display:grid;gap:4px}
.wish .facts strong{color:var(--yellow);font-size:22px;font-weight:800}
.wish .facts span{font-size:13px;opacity:.85}
.wish ul.clean li{font-size:14px}
.wish ul.clean li::marker{color:var(--yellow)}

/* Next */
.todo{display:grid;gap:8px}
.todo label{display:flex;gap:12px;align-items:flex-start;font-size:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.todo input{margin-top:4px;accent-color:var(--ink)}
footer{padding-block:56px 40px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer b{color:var(--ink);font-weight:600}
a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
<style>
.lock{min-height:100vh;display:grid;place-items:center;background:var(--yellow);color:var(--on-yellow);padding-block:40px}
.lock-box{width:100%;max-width:400px;display:grid;gap:16px}
.lock-box .eyebrow{color:var(--on-yellow);opacity:.7}
.lock-box h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em}
.lock-box p{font-size:14px}
.lock-form{display:grid;gap:10px}
.lock-form label{font-size:13px;font-weight:600}
.lock-form input{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid #141310;background:#FFFFFF;color:#141310}
.lock-form button{font:inherit;font-weight:600;font-size:15px;padding:12px 14px;border-radius:12px;border:0;background:#141310;color:#FFD447;cursor:pointer}
.lock-form button:focus-visible,.lock-form input:focus-visible{outline:2px solid #141310;outline-offset:2px}
.lock-err{font-size:13px;font-weight:600;min-height:1.2em}
</style>
<div class="lock" id="lock">
  <div class="lock-box">
    <p class="eyebrow">Konzept · vertraulich</p>
    <h1>Der Liesl-Adventskalender</h1>
    <p>Dieses Konzept ist passwortgeschützt. Gib das Passwort ein, um es zu öffnen.</p>
    <form class="lock-form" id="lockForm" autocomplete="off">
      <label for="pw">Passwort</label>
      <input id="pw" type="password" required>
      <button type="submit" id="unlockBtn">Konzept öffnen</button>
      <p class="lock-err" id="err" role="alert"></p>
    </form>
  </div>
</div>
<div id="content" hidden></div>
